server {
    listen 80;
    root /usr/share/nginx/html;
    access_log  off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml image/x-icon;

    # Файли з хешем у назві не змінюються — кешуємо на рік
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|webp|svg|ico|woff2?|ttf|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Пререндерені сторінки: /services -> /services/index.html.
    # Невідомі адреси отримують SPA-оболонку зі статусом 404, щоб не потрапляли в індекс.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Сторінки, які рендеряться лише в браузері (нові статті, кабінет, відновлення пароля)
    location ~ ^/(blog/|account|login|admin|reset-password|restore-password/) {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /spa.html;
    }

    error_page 404 /spa.html;
    location = /spa.html {
        add_header Cache-Control "no-cache";
    }
}
